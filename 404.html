<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Page not found — Victoriano Tena Rodríguez</title>
<meta name="robots" content="noindex">
<meta name="color-scheme" content="light dark">
<meta name="referrer" content="strict-origin-when-cross-origin">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'none'; object-src 'none'; base-uri 'self'; form-action 'none'">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='8' fill='%230b6e4f'/><text y='69' x='50' text-anchor='middle' font-size='50' font-family='Georgia,serif' font-weight='700' fill='%23f7f8f6'>VT</text></svg>">
<link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png">
<link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
<script>
  try{
    var t=localStorage.getItem('vt-theme');
    if(t==='dark'||t==='light')document.documentElement.setAttribute('data-theme',t);
    var l=localStorage.getItem('vt-lang');
    if(l==='es'||l==='en')document.documentElement.lang=l;
  }catch(e){}
</script>
<style>
  :root{
    --paper:#f7f8f6; --ink:#14201c; --ink-soft:#31423b; --muted:#5c6b65;
    --line:#dce3de; --accent:#0b6e4f;
    --sans:"Segoe UI",system-ui,-apple-system,"Helvetica Neue",Arial,sans-serif;
    --serif:Georgia,"Iowan Old Style","Times New Roman",serif;
    --mono:ui-monospace,"Cascadia Mono",Consolas,"SFMono-Regular",monospace;
  }
  @media (prefers-color-scheme:dark){
    :root{--paper:#0c1210;--ink:#e7eeea;--ink-soft:#c3d0ca;--muted:#8fa39a;--line:#223029;--accent:#3fcf8e}
  }
  :root[data-theme="light"]{--paper:#f7f8f6;--ink:#14201c;--ink-soft:#31423b;--muted:#5c6b65;--line:#dce3de;--accent:#0b6e4f}
  :root[data-theme="dark"]{--paper:#0c1210;--ink:#e7eeea;--ink-soft:#c3d0ca;--muted:#8fa39a;--line:#223029;--accent:#3fcf8e}
  *{box-sizing:border-box}
  body{
    margin:0;min-height:100vh;display:grid;place-items:center;
    background:var(--paper);color:var(--ink);font:16px/1.5 var(--sans);
    -webkit-font-smoothing:antialiased;padding:24px;
  }
  main{max-width:36em}
  .code{font:600 12px/1.4 var(--mono);letter-spacing:.19em;text-transform:uppercase;color:var(--muted);margin:0 0 20px}
  .rule{
    height:2px;margin:0 0 20px;
    background:
      linear-gradient(var(--accent),var(--accent)) left top/32px 2px no-repeat,
      repeating-linear-gradient(90deg,var(--line) 0 1px,transparent 1px 9px) left top/100% 2px no-repeat;
  }
  h1{font:400 clamp(28px,4.4vw,36px)/1.15 var(--serif);letter-spacing:-.015em;margin:0 0 12px;text-wrap:balance}
  p{margin:0 0 24px;color:var(--ink-soft);max-width:62ch}
  a{display:inline-block;font-weight:600;color:var(--accent);text-decoration:none;
    border-bottom:1px solid var(--accent);padding-bottom:2px}
  a:focus-visible{outline:2px solid var(--accent);outline-offset:4px;border-radius:2px}
  html[lang="en"] [data-es],html[lang="es"] [data-en]{display:none}
</style>
</head>
<body>
<main>
  <p class="code">404</p>
  <div class="rule" aria-hidden="true"></div>
  <h1>
    <span data-en lang="en">That page doesn't exist.</span>
    <span data-es lang="es">Esa página no existe.</span>
  </h1>
  <p data-en lang="en">The link may be out of date. Everything on this site lives on one page.</p>
  <p data-es lang="es">Puede que el enlace esté desactualizado. Todo lo de esta web está en una sola página.</p>
  <a href="/">
    <span data-en lang="en">Go to the home page</span>
    <span data-es lang="es">Ir a la página principal</span>
  </a>
</main>
</body>
</html>
